name: Repository policy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main

permissions: {}

jobs:
  validate-workflows:
    name: Validate workflow YAML
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 # actionlint v1.7.12

      - name: Lint workflows
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint/actionlint
        run: '"$ACTIONLINT_BIN"'

      - name: Lint caller templates
        env:
          ACTIONLINT_BIN: ${{ runner.temp }}/actionlint/actionlint
        shell: bash
        run: '"$ACTIONLINT_BIN" templates/.github/workflows/*.yml'

      - name: Validate template JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in templates/*.json templates/.*.json; do
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Check workflow conventions
        # Full-SHA pins with exact tag comments, kebab-case inputs,
        # UPPER_SNAKE_CASE secrets, and explicit permissions and timeouts.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          import yaml

          errors = []
          workflows = sorted(Path(".github/workflows").glob("*.yml"))
          templates = sorted(Path("templates/.github/workflows").glob("*.yml"))
          actions = sorted(Path(".github/actions").glob("*/action.yml"))

          pin = re.compile(r"^[\w.-]+/[\w./-]+@[0-9a-f]{40}$")
          placeholder = re.compile(r"^abijith-suresh/workflows/[\w./-]+@FULL_COMMIT_SHA$")
          exact_tag = re.compile(r"#\s*v\d+\.\d+\.\d+\s*$")
          kebab = re.compile(r"^[a-z][a-z0-9]*(-[a-z0-9]+)*$")
          upper_snake = re.compile(r"^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$")

          for path in workflows + templates + actions:
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.match(r"^\s*(?:-\s+)?uses:\s*(\S+)(.*)$", line)
                  if not match or line.lstrip().startswith("#"):
                      continue
                  ref, rest = match.groups()
                  if ref.startswith("./") or ref.startswith("docker://"):
                      continue
                  if path in templates and placeholder.match(ref):
                      if "# vX.Y.Z" not in rest:
                          errors.append(f"{path}:{number}: placeholder pins carry '# vX.Y.Z'")
                      continue
                  if not pin.match(ref):
                      errors.append(f"{path}:{number}: pin {ref} to a full commit SHA")
                  elif not exact_tag.search(rest):
                      errors.append(f"{path}:{number}: comment the exact release tag, such as '# v1.2.3'")

          for path in workflows + templates:
              doc = yaml.safe_load(path.read_text())
              triggers = doc.get("on", doc.get(True)) or {}
              if "permissions" not in doc:
                  errors.append(f"{path}: set top-level permissions (usually {{}})")
              call = triggers.get("workflow_call") if isinstance(triggers, dict) else None
              if isinstance(call, dict):
                  for name in (call.get("inputs") or {}):
                      if not kebab.match(name):
                          errors.append(f"{path}: input {name!r} must be kebab-case")
                  for name in (call.get("secrets") or {}):
                      if not upper_snake.match(name):
                          errors.append(f"{path}: secret {name!r} must be UPPER_SNAKE_CASE")
              for job_id, job in (doc.get("jobs") or {}).items():
                  if "permissions" not in job:
                      errors.append(f"{path}: job {job_id!r} must set permissions")
                  if "runs-on" in job and "timeout-minutes" not in job:
                      errors.append(f"{path}: job {job_id!r} must set timeout-minutes")

          for path in actions:
              doc = yaml.safe_load(path.read_text())
              for name in (doc.get("inputs") or {}):
                  if not kebab.match(name):
                      errors.append(f"{path}: input {name!r} must be kebab-case")

          for error in errors:
              print(f"::error::{error}")
          if errors:
              raise SystemExit(1)
          print(f"Checked {len(workflows)} workflows, {len(templates)} templates, {len(actions)} actions.")
          PY

      - name: Check changed content for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || -z "$AFTER_SHA" ]]; then
            echo "Missing comparison SHA." >&2
            exit 1
          fi

          if [[ "$base_sha" == "$zero_sha" ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi

          git diff --check "$base_sha" "$AFTER_SHA" --

      - name: Validate release metadata JSON
        # Check before merge; the reusable release job checks each caller at runtime.
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("release-please-config.json").read_text())
          manifest = json.loads(Path(".release-please-manifest.json").read_text())
          version = Path("VERSION").read_text().strip()

          if manifest.get(".") != version:
              raise SystemExit(".release-please-manifest.json must match VERSION")

          packages = config.get("packages")
          if not isinstance(packages, dict) or not packages:
              raise SystemExit("release-please-config.json must define at least one package")

          for package_path, package in packages.items():
              if not isinstance(package, dict):
                  raise SystemExit(f"Release Please package {package_path!r} must be an object")
              for option in ("include-v-in-tag", "include-v-in-release-name"):
                  if package.get(option, config.get(option)) is False:
                      raise SystemExit(
                          f"Release Please option {option!r} must be unset for {package_path!r}"
                      )
          PY

  validate-title:
    name: Conventional Commit title
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/conventional-commit-title.yml
    permissions:
      pull-requests: read

  gate-action:
    name: Gate action
    if: ${{ !cancelled() }}
    needs: [validate-workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the gate action against this job's needs
        uses: ./.github/actions/gate
        with:
          needs: ${{ toJSON(needs) }}
