name: npm quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}

      - name: Set up Node.js from root version file
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Read exact npm version from root package.json
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          echo "version=${package_manager#npm@}" >> "$GITHUB_OUTPUT"

      - name: Install exact npm version
        shell: bash
        env:
          NPM_VERSION: ${{ steps.npm-version.outputs.version }}
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify
