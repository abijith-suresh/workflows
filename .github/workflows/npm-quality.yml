name: npm quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          persist-credentials: false

      - name: Validate root versions in mise.toml
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f mise.toml ]]; then
            echo 'Missing required root mise.toml; declare exact versions under [tools], for example node = "24.20.0" and npm = "11.16.0".' >&2
            exit 1
          fi

          for tool in node npm; do
            entry="$(awk -v tool="$tool" '
              /^[[:space:]]*\[/ { in_tools = ($0 ~ /^[[:space:]]*\[tools\][[:space:]]*$/) }
              in_tools && $0 ~ "^[[:space:]]*" tool "[[:space:]]*=" { count++; line = $0 }
              END { if (count != 1) exit 1; print line }
            ' mise.toml)" || {
              echo "Root mise.toml must declare the $tool version exactly once under [tools]." >&2
              exit 1
            }

            version="$(printf '%s\n' "$entry" | sed -e 's/^[^=]*=[[:space:]]*//' -e 's/[[:space:]]*#.*$//' | tr -d "\"'")"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Root mise.toml must declare exactly one $tool version as major.minor.patch; found '$version'." >&2
              exit 1
            fi

            echo "${tool}_version=$version" >> "$GITHUB_ENV"
          done

      - name: Set up Node.js from root mise.toml
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.node_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm version
        shell: bash
        env:
          NPM_VERSION: ${{ env.npm_version }}
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify
