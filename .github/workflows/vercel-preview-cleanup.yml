name: Clean up Vercel preview deployments

on:
  workflow_call:
    inputs:
      vercel_project:
        description: Vercel project containing the previews
        required: true
        type: string
      vercel_scope:
        description: Vercel team slug that owns the project
        required: true
        type: string
    secrets:
      vercel_token:
        description: Project-scoped Vercel token stored in the caller repository
        required: true

permissions: {}

jobs:
  cleanup:
    name: Remove previews for the closed pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
      VERCEL_PROJECT: ${{ inputs.vercel_project }}
      VERCEL_SCOPE: ${{ inputs.vercel_scope }}
      VERCEL_TOKEN: ${{ secrets.vercel_token }}
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@59.23.2

      - name: Remove previews for this closed pull request
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Add a project-scoped VERCEL_TOKEN Actions secret to this repository."
            exit 1
          fi
          if [[ ! "${PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::This workflow requires a pull_request event."
            exit 1
          fi
          if [[ -z "${VERCEL_PROJECT:-}" || -z "${VERCEL_SCOPE:-}" ]]; then
            echo "::error::Both vercel_project and vercel_scope inputs are required."
            exit 1
          fi

          repository_owner="${GH_REPOSITORY%%/*}"
          repository_name="${GH_REPOSITORY##*/}"
          shared_head="false"
          if [[ -n "${PR_HEAD_REF:-}" && -n "${PR_HEAD_REPOSITORY:-}" ]]; then
            open_pulls="$(gh api --paginate --jq '.[]' \
              "repos/${GH_REPOSITORY}/pulls?state=open&per_page=100")"
            if [[ -n "$open_pulls" ]] && jq -s -e \
              --arg head "$PR_HEAD_REF" \
              --arg head_repository "$PR_HEAD_REPOSITORY" \
              'any(.[]; .head.ref == $head and .head.repo.full_name == $head_repository)' \
              <<< "$open_pulls" >/dev/null; then
              shared_head="true"
              echo "An open pull request shares this head branch; active aliases will be protected."
            fi
          fi

          deployment_urls=()
          next_page=""
          while :; do
            list_args=(ls "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" --json --limit 100 \
              --meta "githubPrId=$PR_NUMBER" --no-color)
            if [[ -n "$next_page" ]]; then
              list_args+=(--next "$next_page")
            fi
            deployment_list="$(vercel "${list_args[@]}")"
            if ! jq -e '.deployments | type == "array"' <<< "$deployment_list" >/dev/null; then
              echo "::error::Vercel returned an invalid deployment list."
              exit 1
            fi
            mapfile -t page_urls < <(jq -r \
              --arg owner "$repository_owner" \
              --arg repo "$repository_name" \
              --arg pr "$PR_NUMBER" \
              '.deployments[] | select(.meta.githubOrg == $owner and .meta.githubRepo == $repo and (.meta.githubPrId | tostring) == $pr and .target != "production") | .url' \
              <<< "$deployment_list")
            deployment_urls+=("${page_urls[@]}")
            next_page="$(jq -r '.pagination.next // empty' <<< "$deployment_list")"
            if [[ -z "$next_page" ]]; then
              break
            fi
          done

          if (( ${#deployment_urls[@]} == 0 )); then
            echo "No Vercel deployments matched pull request #${PR_NUMBER}."
            exit 0
          fi

          for deployment_url in "${deployment_urls[@]}"; do
            inspect_output="$(vercel inspect "$deployment_url" --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN" --format json --no-color 2>&1)" || {
              echo "::warning::Could not inspect $deployment_url; skipping it."
              continue
            }
            deployment_details="$(sed -n '/^{/,$p' <<< "$inspect_output")"
            deployment_id="$(jq -r '.id // .uid // empty' <<< "$deployment_details")"
            deployment_target="$(jq -r '.target // empty' <<< "$deployment_details")"

            if [[ -z "$deployment_id" ]]; then
              echo "::error::Could not resolve the deployment ID for $deployment_url."
              exit 1
            fi
            if [[ "$deployment_target" != "preview" ]]; then
              echo "Skipping $deployment_url because its target is ${deployment_target:-unknown}."
              continue
            fi

            remove_args=(rm "$deployment_id" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --yes --no-color)
            if [[ "$shared_head" == "true" ]]; then
              remove_args+=(--safe)
            fi
            vercel "${remove_args[@]}"
          done
