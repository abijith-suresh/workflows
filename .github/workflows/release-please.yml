name: Release Please

# Callers provide root release-please-config.json and .release-please-manifest.json
# files. Restrict the fine-grained token to the caller repository with the write
# access listed in the job's permissions. Filter both pushes and manual runs to
# the intended release branches; see release.yml for this repository's caller.
# Tags use the release-please default, v<version>: leave include-v-in-tag and
# include-v-in-release-name unset. When migrating from unprefixed tags, keep the
# existing tags and the current manifest version; the next release creates the
# next v tag. Drop bootstrap-sha once a release exists.
on:
  workflow_call:
    inputs:
      target-branch:
        description: Branch that receives the release pull request; defaults to the caller's ref
        required: false
        type: string
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: Fine-grained token used for release pull requests and tags
        required: true
permissions: {}

concurrency:
  group: release-please-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or update release PR
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("release-please-config.json")
          if not config_path.is_file():
              raise SystemExit("Missing root release-please-config.json")
          config = json.loads(config_path.read_text())
          packages = config.get("packages")
          if not isinstance(packages, dict) or not packages:
              raise SystemExit("release-please-config.json must define at least one package")

          for package_path, package in packages.items():
              if not isinstance(package, dict):
                  raise SystemExit(f"Release Please package {package_path!r} must be an object")
              for option in ("include-v-in-tag", "include-v-in-release-name"):
                  if package.get(option, config.get(option)) is False:
                      raise SystemExit(
                          f"Release Please option {option!r} must be unset for {package_path!r}; "
                          "tags use the default v<version> form"
                      )
              if "bootstrap-sha" in package or "bootstrap-sha" in config:
                  print(
                      "::warning file=release-please-config.json::"
                      "bootstrap-sha only matters before the first release; remove it once one exists"
                  )
          PY

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ inputs.target-branch || github.ref_name }}
