name: Release Please

# Reusable release automation. Callers keep only release-please-config.json
# (single package, no-v tags, see this repository's config for the standard)
# and .release-please-manifest.json at their root, plus a fine-grained
# RELEASE_PLEASE_TOKEN secret (Contents/Issues/Pull requests: read and write).
# Callers trigger on pushes to their default branch.
# The caller job must grant contents, issues, and pull-requests write access;
# this workflow never receives secrets via `secrets: inherit`.
on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: Fine-grained token used for release pull requests and tags
        required: true
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Create or update release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
