name: Bun quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}

      - name: Validate root Bun version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bun-version ]]; then
            echo "Missing required root .bun-version; add an exact Bun version such as 1.2.3." >&2
            exit 1
          fi

          bun_version="$(< .bun-version)"
          if [[ ! "$bun_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Root .bun-version must contain exactly major.minor.patch (for example, 1.2.3); found '$bun_version'." >&2
            exit 1
          fi

      - name: Set up Bun from root version file
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Validate Bun package metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "Missing required root package.json; declare packageManager as bun@major.minor.patch." >&2
            exit 1
          fi

          bun_version="$(< .bun-version)"
          if ! package_manager="$(bun -e 'const packageJson = await Bun.file("package.json").json(); console.log(typeof packageJson?.packageManager === "string" ? packageJson.packageManager : "");')"; then
            echo "Root package.json could not be parsed as JSON by Bun." >&2
            exit 1
          fi

          if [[ ! "$package_manager" =~ ^bun@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Root package.json must declare an exact packageManager as bun@major.minor.patch; found '$package_manager'." >&2
            exit 1
          fi

          declared_version="${package_manager#bun@}"
          if [[ "$declared_version" != "$bun_version" ]]; then
            echo "Root .bun-version ('$bun_version') must match package.json packageManager ('$package_manager')." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify project
        run: bun run verify
