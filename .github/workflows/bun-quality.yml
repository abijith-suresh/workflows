name: Bun frontend quality

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Bun project
        required: false
        type: string
        default: .
      verify-command:
        description: Command to run after installing dependencies
        required: false
        type: string
        default: bun run verify

permissions:
  contents: read

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Find Bun version file
        id: bun-version-file
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [[ -f "$WORKING_DIRECTORY/.bun-version" ]]; then
            echo "path=$WORKING_DIRECTORY/.bun-version" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun from caller version file
        if: steps.bun-version-file.outputs.path != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ steps.bun-version-file.outputs.path }}

      - name: Set up latest Bun
        if: steps.bun-version-file.outputs.path == ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: bun install --frozen-lockfile

      - name: Verify project
        working-directory: ${{ inputs.working-directory }}
        env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: bash -euo pipefail -c "$VERIFY_COMMAND"
