name: Bun quality

# Callers need root mise.toml with one bun version under [tools], pinned to
# major.minor.patch, plus bun.lock and package.json with a verify script.
on:
  workflow_call:

permissions: {}

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate root Bun version in mise.toml
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f mise.toml ]]; then
            echo 'Missing required root mise.toml.' >&2
            exit 1
          fi

          bun_entry="$(awk '
            /^[[:space:]]*\[/ { in_tools = ($0 ~ /^[[:space:]]*\[tools\][[:space:]]*$/) }
            in_tools && /^[[:space:]]*bun[[:space:]]*=/ { count++; line = $0 }
            END { if (count != 1) exit 1; print line }
          ' mise.toml)" || {
            echo 'Root mise.toml must declare bun exactly once under [tools].' >&2
            exit 1
          }

          bun_version="$(printf '%s\n' "$bun_entry" | sed -e 's/^[^=]*=[[:space:]]*//' -e 's/[[:space:]]*#.*$//' | tr -d "\"'")"
          if [[ ! "$bun_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Root mise.toml bun version must be major.minor.patch; found '$bun_version'." >&2
            exit 1
          fi

          echo "bun_version=$bun_version" >> "$GITHUB_ENV"

      - name: Set up Bun from root mise.toml
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.bun_version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify project
        run: bun run verify
