name: Bun quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Install and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}

      - name: Validate root Bun version in mise.toml
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f mise.toml ]]; then
            echo "Missing required root mise.toml; declare an exact Bun version under [tools], for example bun = \"1.2.3\"." >&2
            exit 1
          fi

          bun_version="$(sed -n 's/^[[:space:]]*bun[[:space:]]*=[[:space:]]*//p' mise.toml | tr -d "\"'")"
          if [[ -z "$bun_version" ]]; then
            echo "Root mise.toml must declare a Bun version under [tools], for example bun = \"1.2.3\"." >&2
            exit 1
          fi

          if [[ ! "$bun_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Root mise.toml must declare exactly one Bun version as major.minor.patch (for example, 1.2.3); found '$bun_version'." >&2
            exit 1
          fi

          echo "bun_version=$bun_version" >> "$GITHUB_ENV"

      - name: Set up Bun from root mise.toml
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.bun_version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify project
        run: bun run verify
